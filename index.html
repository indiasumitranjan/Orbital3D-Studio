<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Orbital3D Studio | Professional Molecular Engine</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚛️</text></svg>">
  <style>
    :root {
      --bg: #06090e;
      --panel: rgba(13, 19, 33, 0.92);
      --accent: #3b82f6;
      --glow: #60a5fa;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
      --border: rgba(255, 255, 255, 0.12);
    }
    body {
      margin: 0;
      overflow: hidden;
      background-color: var(--bg);
      color: #f3f4f6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      /* touch-action removed so mobile/touch OrbitControls work */
    }
    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10000;
      background: var(--panel);
      backdrop-filter: blur(16px);
      padding: 18px;
      border-radius: 14px;
      border: 1px solid var(--border);
      width: 330px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.7);
      max-height: 85vh;
      overflow-y: auto;
    }
    h1 {
      font-size: 17px;
      margin: 0 0 12px 0;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      letter-spacing: 0.5px;
    }
    .badge {
      font-size: 10px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      padding: 3px 7px;
      border-radius: 4px;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .control-group { margin-bottom: 12px; }
    label {
      font-size: 11px;
      color: #9ca3af;
      display: block;
      margin-bottom: 4px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    select, button, input {
      width: 100%;
      background: #1e293b;
      color: white;
      border: 1px solid var(--border);
      padding: 8px 10px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 6px;
      box-sizing: border-box;
      font-size: 12px;
    }
    input { cursor: text; font-weight: 400; }
    input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3); }
    button:hover { background: #334155; border-color: var(--accent); }
    button.primary { background: var(--accent); border: none; }
    button.primary:hover { background: #2563eb; }
    button.active { background: #10b981; border-color: #059669; }
    .search-box { display: flex; gap: 6px; }
    .search-box button { width: 80px; margin-bottom: 0; }
    .btn-row { display: flex; gap: 6px; }
    .btn-row button { flex: 1; }
    .stats {
      font-family: 'JetBrains Mono', monospace, system-ui;
      font-size: 11px;
      background: rgba(0,0,0,0.5);
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .stat-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
    .stat-value { color: var(--glow); font-weight: 600; }
    .stat-value.alert { color: var(--danger); font-weight: bold; }
    .stat-value.highlight { color: var(--warning); font-weight: bold; }
    
    #newmanOverlay {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      background: var(--panel);
      backdrop-filter: blur(12px);
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      display: none;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .atom-label {
      position: absolute;
      color: #ffffff;
      font-family: monospace;
      font-size: 10px;
      font-weight: bold;
      background: rgba(15, 23, 42, 0.85);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
      pointer-events: none;
      transform: translate(-50%, -100%);
      white-space: nowrap;
      z-index: 5;
    }
    #measureTooltip {
      position: absolute;
      top: 20px;
      right: 20px;
      background: var(--panel);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 12px;
      z-index: 1000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    /* Focus outlines for accessibility */
    button:focus { outline: 2px solid rgba(59,130,246,0.6); outline-offset: 2px; }
  </style>

  <!-- Three.js & Core Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
  <!-- Post-Processing Pipeline -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

  <!-- Animation Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <!-- RDKit.js (WASM) will be loaded on demand; this is a CDN-first loader with automatic vendor fallback. -->
</head>
<body>

<div id="labelsContainer"></div>

<div id="measureTooltip">
  <strong>Measurement Tool:</strong> <span id="measureModeStatus">Disabled</span><br>
  <span id="measureInstruction" style="color: #9ca3af; font-size: 11px;">Enable mode below and click atoms.</span>
</div>

<div id="hud">
  <h1>Orbital3D Studio <span class="badge">PRO</span></h1>
  
  <div class="control-group">
    <label>PubChem Search Engine</label>
    <div class="search-box">
      <input type="text" id="chemSearchInput" placeholder="e.g. ethanol, benzene, caffeine">
      <button id="pubchemLoadBtn" class="primary">Load</button>
    </div>
  </div>

  <div class="control-group">
    <label>SMILES / RDKit</label>
    <input type="text" id="smilesInput" placeholder="e.g. C[C@H](O)CC">
    <div class="btn-row">
      <button id="rdkitLoadBtn" class="primary">Load SMILES</button>
      <button id="rdkitInitBtn">Init RDKit</button>
    </div>
    <div style="font-size:11px; color:#9ca3af; display:flex; gap:8px; align-items:center;">
      <div id="rdkitStatus">RDKit: Not loaded</div>
    </div>
  </div>

  <div class="control-group">
    <label>Cyclohexane Conformers</label>
    <select id="conformerSelect">
      <option value="chair">Chair Conformation (0 kJ/mol)</option>
      <option value="halfChair">Half-Chair State (45 kJ/mol)</option>
      <option value="twist">Twist-Boat State (23 kJ/mol)</option>
      <option value="boat">Boat Conformation (30 kJ/mol)</option>
      <option value="chairFlipped">Flipped Chair (0 kJ/mol)</option>
    </select>
    <button id="flipBtn" class="primary">Animate Chair Inversion (Ring Flip)</button>
  </div>

  <div class="control-group">
    <label>Interactive Measurement Engine</label>
    <div class="btn-row">
      <button id="measureToggleBtn" aria-pressed="false">Click Measure: OFF</button>
      <button id="clearSelectBtn">Clear Select</button>
    </div>
  </div>

  <div class="control-group">
    <label>Display & Studio Lighting</label>
    <button id="newmanToggleBtn">Toggle Newman Projection Lock</button>
    <div class="btn-row">
      <button id="repToggleBtn">Display: <span id="repLabel">Ball & Stick</span></button>
      <button id="labelsToggleBtn">Labels: <span id="labelStateLabel">OFF</span></button>
    </div>
    <div class="btn-row">
      <button id="bloomToggleBtn">Bloom Glow: <span id="bloomStatusLabel">ON</span></button>
      <button id="orbitalToggleBtn">Toggle Lone Pairs</button>
    </div>
    <button id="axEqBtn">Highlight Axial / Equatorial</button>
  </div>

  <div class="stats">
    <div class="stat-row"><span>C1-C4 Distance:</span> <span id="distVal" class="stat-value">--</span></div>
    <div class="stat-row"><span>Flagpole Strain:</span> <span id="strainVal" class="stat-value">None</span></div>
    <div class="stat-row"><span>Picked Angle:</span> <span id="dihedralVal" class="stat-value">--</span></div>
    <div class="stat-row"><span>Relative Energy:</span> <span id="energyVal" class="stat-value">0 kJ/mol</span></div>
    <div class="stat-row"><span>View Angle:</span> <span id="viewAngleVal" class="stat-value">3D Studio Orbit</span></div>
  </div>
</div>

<div id="newmanOverlay">
  <svg width="110" height="110" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="35" stroke="#475569" stroke-width="3" fill="none" />
    <circle cx="50" cy="50" r="6" fill="#3b82f6" />
    <line x1="50" y1="50" x2="50" y2="10" stroke="#3b82f6" stroke-width="3" />
    <line x1="50" y1="50" x2="15" y2="70" stroke="#3b82f6" stroke-width="3" />
    <line x1="50" y1="50" x2="85" y2="70" stroke="#3b82f6" stroke-width="3" />
    <line x1="50" y1="15" x2="50" y2="0" stroke="#f59e0b" stroke-width="3" />
    <line x1="15" y1="70" x2="0" y2="80" stroke="#f59e0b" stroke-width="3" />
    <line x1="85" y1="70" x2="100" y2="80" stroke="#f59e0b" stroke-width="3" />
  </svg>
  <div style="font-size:10px; color:#9ca3af; margin-top:2px;">Newman Dihedral Camera</div>
</div>

<script>
  // --- 1. Scene, Renderer & Studio Lighting Setup ---
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x06090e);

  const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(4.5, 3.5, 6.5);

  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.25;
  document.body.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;

  // Studio Lighting System
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambientLight);

  const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
  keyLight.position.set(8, 15, 10);
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0x60a5fa, 0.6);
  fillLight.position.set(-10, -5, -8);
  scene.add(fillLight);

  const rimLight = new THREE.DirectionalLight(0xa7f3d0, 0.8);
  rimLight.position.set(0, 10, -10);
  scene.add(rimLight);

  // --- 2. Unreal Bloom Post-Processing Pipeline ---
  const composer = new THREE.EffectComposer(renderer);
  const renderPass = new THREE.RenderPass(scene, camera);
  composer.addPass(renderPass);

  const bloomPass = new THREE.UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    0.65,
    0.4,
    0.82
  );
  composer.addPass(bloomPass);

  let bloomEnabled = true;
  function toggleBloom() {
    bloomEnabled = !bloomEnabled;
    bloomPass.enabled = bloomEnabled;
    document.getElementById('bloomStatusLabel').innerText = bloomEnabled ? "ON" : "OFF";
  }

  // --- 3. Lone Pair Shader ("Rabbit Ears") ---
  const rabbitEarMaterial = new THREE.ShaderMaterial({
    uniforms: {
      color: { value: new THREE.Color(0x3b82f6) },
      fresnelBias: { value: 0.15 },
      fresnelPower: { value: 2.5 },
      fresnelScale: { value: 1.2 }
    },
    vertexShader: `
      varying vec3 vNormal;
      varying vec3 vViewPosition;
      void main() {
        vNormal = normalize(normalMatrix * normal);
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        vViewPosition = -mvPosition.xyz;
        gl_Position = projectionMatrix * mvPosition;
      }
    `,
    fragmentShader: `
      uniform vec3 color;
      uniform float fresnelBias;
      uniform float fresnelPower;
      uniform float fresnelScale;
      varying vec3 vNormal;
      varying vec3 vViewPosition;
      void main() {
        vec3 viewDir = normalize(vViewPosition);
        float f = clamp(1.0 + dot(vNormal, -viewDir), 0.0, 2.0);
        float fresnelFactor = fresnelBias + fresnelScale * pow(f, fresnelPower);
        gl_FragColor = vec4(color, fresnelFactor * 0.95);
      }
    `,
    transparent: true,
    side: THREE.DoubleSide
  });

  // --- 4. Conformers Coordinates ---
  const conformers = {
    chair: {
      energy: 0,
      coords: [
        [0.0, 0.5, 1.25], [1.2, -0.2, 0.62], [1.2, 0.2, -0.62],
        [0.0, -0.5, -1.25], [-1.2, 0.2, -0.62], [-1.2, -0.2, 0.62]
      ]
    },
    halfChair: {
      energy: 45,
      coords: [
        [0.0, 0.9, 1.2], [1.2, 0.3, 0.6], [1.2, 0.1, -0.6],
        [0.0, -0.3, -1.2], [-1.2, -0.3, -0.6], [-1.2, -0.1, 0.6]
      ]
    },
    twist: {
      energy: 23,
      coords: [
        [0.4, 0.6, 1.1], [1.3, -0.1, 0.4], [0.9, 0.4, -0.7],
        [-0.4, -0.6, -1.1], [-1.3, 0.1, -0.4], [-0.9, -0.4, 0.7]
      ]
    },
    boat: {
      energy: 30,
      coords: [
        [0.0, 0.8, 1.25], [1.2, -0.2, 0.62], [1.2, 0.2, -0.62],
        [0.0, 0.8, -1.25], [-1.2, -0.2, -0.62], [-1.2, -0.2, 0.62]
      ]
    },
    chairFlipped: {
      energy: 0,
      coords: [
        [0.0, -0.5, 1.25], [1.2, 0.2, 0.62], [1.2, -0.2, -0.62],
        [0.0, 0.5, -1.25], [-1.2, -0.2, -0.62], [-1.2, 0.2, 0.62]
      ]
    }
  };

  // State Management
  let carbonMeshes = [];
  let hydrogenMeshes = [];
  let bondMeshes = [];
  let pubchemAtoms = [];
  let customMoleculeGroup = new THREE.Group();
  scene.add(customMoleculeGroup);

  let isSpaceFilling = false;
  let showLabels = false;
  let labelElements = [];
  let isCyclohexaneMode = true;

  const carbonMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.15, metalness: 0.1 });
  const hydrogenMat = new THREE.MeshStandardMaterial({ color: 0xf9fafb, roughness: 0.2 });
  const bondMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.3 });

  // Lower poly counts for performance
  const cGeo = new THREE.SphereGeometry(0.28, 16, 16);
  const hGeo = new THREE.SphereGeometry(0.16, 12, 12);

  const cpkRadii = { 'H': 0.35, 'C': 0.7, 'O': 0.65, 'N': 0.65, 'S': 0.8, 'P': 0.8, 'F': 0.5, 'CL': 0.75 };
  const ballRadii = { 'H': 0.16, 'C': 0.28, 'O': 0.25, 'N': 0.26, 'S': 0.32, 'P': 0.32, 'F': 0.2, 'CL': 0.3 };

  // Caches for parsed molecules (geometry & material reuse)
  const geomCache = {};
  const matCache = {};
  function getSphereGeom(key, radius) {
    const k = key + ':' + radius;
    if (!geomCache[k]) geomCache[k] = new THREE.SphereGeometry(radius, 16, 16);
    return geomCache[k];
  }
  function getMat(colorHex) {
    if (!matCache[colorHex]) matCache[colorHex] = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.25, metalness: 0.1 });
    return matCache[colorHex];
  }

  function initCyclohexane() {
    isCyclohexaneMode = true;
    clearCustomMolecule();
    
    conformers.chair.coords.forEach((pos, idx) => {
      const mesh = new THREE.Mesh(cGeo.clone(), carbonMat.clone());
      mesh.position.set(...pos);
      mesh.userData = { symbol: `C${idx+1}`, isAtom: true };
      scene.add(mesh);
      carbonMeshes.push(mesh);
    });

    for (let i = 0; i < 6; i++) {
      const hAxial = new THREE.Mesh(hGeo.clone(), hydrogenMat.clone());
      const hEquat = new THREE.Mesh(hGeo.clone(), hydrogenMat.clone());
      
      hAxial.userData = { type: 'axial', parentIdx: i, symbol: `H${i*2+1}`, isAtom: true };
      hEquat.userData = { type: 'equatorial', parentIdx: i, symbol: `H${i*2+2}`, isAtom: true };

      scene.add(hAxial, hEquat);
      hydrogenMeshes.push(hAxial, hEquat);
    }

    for (let i = 0; i < 6; i++) {
      const bondGeo = new THREE.CylinderGeometry(0.06, 0.06, 1, 12);
      const bond = new THREE.Mesh(bondGeo, bondMat.clone());
      scene.add(bond);
      bondMeshes.push(bond);
    }

    addOrbitalLobe(carbonMeshes[0], 0.4);
    addOrbitalLobe(carbonMeshes[0], -0.4);

    rebuildLabels();
  }

  // --- 5. Orbitals ---
  const orbitalGroup = new THREE.Group();
  function addOrbitalLobe(parentMesh, rotZ) {
    const lobeGeo = new THREE.SphereGeometry(0.28, 12, 12);
    lobeGeo.scale(0.8, 2.2, 0.8);
    const lobe = new THREE.Mesh(lobeGeo, rabbitEarMaterial);
    lobe.position.set(0, 0.45, 0);
    lobe.rotation.z = rotZ;
    parentMesh.add(lobe);
    orbitalGroup.add(lobe);
  }

  // --- 6. Interactive Measurement Tool ---
  let isMeasuring = false;
  let selectedAtoms = [];
  let measurementLinesGroup = new THREE.Group();
  scene.add(measurementLinesGroup);

  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();

  function toggleMeasurementMode() {
    isMeasuring = !isMeasuring;
    const btn = document.getElementById('measureToggleBtn');
    const status = document.getElementById('measureModeStatus');
    const instruction = document.getElementById('measureInstruction');

    btn.setAttribute('aria-pressed', String(isMeasuring));

    if (isMeasuring) {
      btn.className = "active";
      btn.innerText = "Click Measure: ON";
      status.innerText = "Active - Pick Atoms";
      instruction.innerText = "Click 2 atoms for Distance, or 4 atoms for Dihedral Angle.";
    } else {
      btn.className = "";
      btn.innerText = "Click Measure: OFF";
      status.innerText = "Disabled";
      instruction.innerText = "Enable mode below and click atoms.";
      clearSelection();
    }
  }

  window.addEventListener('click', (event) => {
    if (!isMeasuring) return;

    if (event.target.closest('#hud') || event.target.closest('#newmanOverlay')) return;

    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const targetObjects = isCyclohexaneMode 
      ? [...carbonMeshes, ...hydrogenMeshes]
      : pubchemAtoms.map(a => a.mesh);

    const intersects = raycaster.intersectObjects(targetObjects);

    if (intersects.length > 0) {
      const clickedAtom = intersects[0].object;
      
      if (selectedAtoms.includes(clickedAtom)) {
        selectedAtoms = selectedAtoms.filter(a => a !== clickedAtom);
        clickedAtom.material.emissive && clickedAtom.material.emissive.setHex(0x000000);
      } else {
        if (selectedAtoms.length >= 4) clearSelection();
        selectedAtoms.push(clickedAtom);
        clickedAtom.material.emissive && clickedAtom.material.emissive.setHex(0x60a5fa);
      }
      updateMeasurements();
    }
  });

  function clearSelection() {
    selectedAtoms.forEach(a => a.material.emissive && a.material.emissive.setHex(0x000000));
    selectedAtoms = [];
    while(measurementLinesGroup.children.length > 0) {
      measurementLinesGroup.remove(measurementLinesGroup.children[0]);
    }
    document.getElementById('dihedralVal').innerText = "--";
  }

  function updateMeasurements() {
    while(measurementLinesGroup.children.length > 0) {
      measurementLinesGroup.remove(measurementLinesGroup.children[0]);
    }

    if (selectedAtoms.length === 2) {
      const p1 = selectedAtoms[0].position;
      const p2 = selectedAtoms[1].position;
      const dist = p1.distanceTo(p2);

      drawSpatialLine(p1, p2, 0x10b981);
      document.getElementById('dihedralVal').innerText = `Dist: ${dist.toFixed(2)} Å`;
    } else if (selectedAtoms.length === 4) {
      const p1 = selectedAtoms[0].position;
      const p2 = selectedAtoms[1].position;
      const p3 = selectedAtoms[2].position;
      const p4 = selectedAtoms[3].position;

      drawSpatialLine(p1, p2, 0xf59e0b);
      drawSpatialLine(p2, p3, 0xf59e0b);
      drawSpatialLine(p3, p4, 0xf59e0b);

      const angle = calculateDihedralAngle(p1, p2, p3, p4);
      document.getElementById('dihedralVal').innerText = `Dihedral: ${angle.toFixed(1)}°`;
    }
  }

  function drawSpatialLine(p1, p2, colorHex) {
    const points = [p1, p2];
    const geometry = new THREE.BufferGeometry().setFromPoints(points);
    const material = new THREE.LineBasicMaterial({ color: colorHex, linewidth: 3 });
    const line = new THREE.Line(geometry, material);
    measurementLinesGroup.add(line);
  }

  function calculateDihedralAngle(p1, p2, p3, p4) {
    const b1 = new THREE.Vector3().subVectors(p2, p1);
    const b2 = new THREE.Vector3().subVectors(p3, p2);
    const b3 = new THREE.Vector3().subVectors(p4, p3);

    const n1 = new THREE.Vector3().crossVectors(b1, b2).normalize();
    const n2 = new THREE.Vector3().crossVectors(b2, b3).normalize();
    const m1 = new THREE.Vector3().crossVectors(n1, b2.clone().normalize());
    
    const x = n1.dot(n2);
    const y = m1.dot(n2);

    return Math.atan2(y, x) * (180 / Math.PI);
  }

  function triggerChairFlipAnimation() {
    if (!isCyclohexaneMode || isAnimatingFlip) return;
    isAnimatingFlip = true;

    const timeline = gsap.timeline({
      onComplete: () => {
        isAnimatingFlip = false;
        document.getElementById('conformerSelect').value = "chairFlipped";
      }
    });

    const sequence = ['halfChair', 'twist', 'boat', 'chairFlipped'];
    
    sequence.forEach((stepKey) => {
      const target = conformers[stepKey];
      timeline.to(carbonMeshes.map(m => m.position), {
        x: (i) => target.coords[i][0],
        y: (i) => target.coords[i][1],
        z: (i) => target.coords[i][2],
        duration: 0.9,
        ease: "power2.inOut",
        onStart: () => {
          document.getElementById('energyVal').innerText = target.energy + " kJ/mol";
        }
      });
    });
  }

  // --- 8. Spatial Mechanics ---
  function updateHydrogensAndBonds() {
    if (!isCyclohexaneMode || carbonMeshes.length < 6) return;
    for (let i = 0; i < 6; i++) {
      const cPos = carbonMeshes[i].position;
      const hAxial = hydrogenMeshes[i * 2];
      const hEquat = hydrogenMeshes[i * 2 + 1];

      if (!hAxial || !hEquat) continue;

      const axDir = new THREE.Vector3(0, i % 2 === 0 ? 1 : -1, 0);
      const eqDir = cPos.clone().setY(0);
      if (eqDir.length() < 1e-6) eqDir.set(1,0,0); else eqDir.normalize();

      const hDist = isSpaceFilling ? 0.75 : 0.95;
      hAxial.position.copy(cPos).add(axDir.multiplyScalar(hDist));
      hEquat.position.copy(cPos).add(eqDir.multiplyScalar(hDist));

      const p1 = carbonMeshes[i].position;
      const p2 = carbonMeshes[(i + 1) % 6].position;
      const bond = bondMeshes[i];

      const dist = p1.distanceTo(p2);
      bond.scale.set(1, dist, 1);
      bond.position.copy(p1).add(p2).multiplyScalar(0.5);
      bond.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), p2.clone().sub(p1).normalize());
      bond.visible = !isSpaceFilling;
    }
  }
